/* Artboard AI live cockpit – main desktop viewport contains terminal and all controls. */
.artboard-console{display:grid;grid-template-rows:auto minmax(0,1fr) minmax(160px,23vh);gap:8px;height:100%;min-height:0}
.artboard-console-top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:50px}
.artboard-console-top .console-heading{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.console-heading strong{font-size:17px;letter-spacing:.01em;color:#ddf7ff}
.console-heading small{font-size:10px;color:#8ebacf}
.artboard-console-top .mode-choice{display:flex;flex-wrap:nowrap;gap:7px;max-width:670px;flex:1}
.artboard-console-top .mode-choice button{padding:6px 10px;min-height:45px;flex:1;border-radius:8px}
.artboard-console-top .mode-choice small{font-size:9px}
.artboard-console .workspace-grid.artboard-layout{display:grid;grid-template-columns:minmax(220px,27%) minmax(260px,1fr) minmax(235px,27%);gap:8px;min-height:0}
.artboard-console .tool-panel{padding:10px;min-height:0;overflow:auto;scrollbar-width:thin}
.artboard-console .tool-panel-title{margin-bottom:6px}
.artboard-console .subhead{margin-top:8px;margin-bottom:5px}
.artboard-console .dropzone{min-height:108px;padding:10px}
.artboard-console .dropzone .upload-icon{font-size:18px}
.artboard-console .mini-note{margin:7px 0;font-size:10px}
.artboard-console .option-chips{gap:5px}
.artboard-console .option-chips button{padding:6px 8px}
.artboard-console .preview-box{height:clamp(190px,36vh,410px);max-height:100%}
.artboard-live-preview{display:flex;flex-direction:column;min-height:0}
.artboard-live-preview .preview-box{position:relative;isolation:isolate}
.artboard-live-preview .preview-box img{width:100%;height:100%;object-fit:contain}
.artboard-live-preview .preview-caption{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;margin:7px 0;flex-wrap:wrap}
.artboard-live-preview .preview-caption small{color:#79afca}
.scan-beam{pointer-events:none;position:absolute;z-index:2;inset:0;display:none;border:1px solid #00e6d5;border-radius:9px;box-shadow:inset 0 0 35px #17afff25}
.is-scanning .scan-beam,.is-generating .scan-beam,.is-vectorizing .scan-beam{display:block}
.is-scanning .scan-beam::before,.is-generating .scan-beam::before,.is-vectorizing .scan-beam::before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,transparent,#50ffe8 40%,#a0f7ff,transparent);
  box-shadow:0 0 20px 5px #29eafa90;animation:artboard-sweep 2.4s ease-in-out infinite alternate
}
.is-generating .scan-beam{border-color:#9682ff;box-shadow:inset 0 0 38px #9573ff35}
.is-vectorizing .scan-beam{border-color:#ffc66a}
@keyframes artboard-sweep{0%{top:1%;opacity:.35}100%{top:98%;opacity:1}}
.artboard-console .metric-row{gap:6px;margin-top:4px}
.artboard-console .metric{padding:5px;min-width:0}
.artboard-console .metric strong{overflow-wrap:anywhere}
.artboard-console .pipeline{margin:0;min-height:0;overflow:hidden;padding:8px 10px}
.artboard-console .pipeline-head{padding-bottom:5px}
.artboard-console .processing-shell{height:calc(100% - 32px);min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(150px,210px);gap:10px}
.artboard-console .processing-shell>div:first-child{min-height:0;display:flex;flex-direction:column}
.artboard-console .processing-shell .stepper{margin:0 0 5px;flex:none}
.artboard-console .processing-shell .log{min-height:0;max-height:none;flex:1;font-size:10px;line-height:1.45}
.artboard-console .processing-summary{min-height:0;overflow:auto;padding:5px}
.artboard-console .progress-orb{width:54px;height:54px;margin:auto}
.artboard-console .progress-orb .orb-value{font-size:12px}
.artboard-console .processing-summary p{margin:4px 0}
.artboard-console .recovery-actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.artboard-console .recovery-actions button{font-size:10px;min-height:33px;padding:5px 7px;flex:1}
.artboard-console .recovery-actions button:disabled{opacity:.42;cursor:not-allowed}
.artboard-console .progress.indeterminate #progressValue{width:26%!important;animation:artboard-indeterminate 1.8s ease-in-out infinite}

async function call(engine,path,{method='GET',json=null,body=null,response='json',timeoutMs=null}={}){
 const headers={};let content=body;
 if(json!==null){headers['Content-Type']='application/json';content=JSON.stringify(json)}
 const controller=typeof AbortController==='function'?new AbortController():null;
 const requestTimeout=timeoutMs??(method==='GET'?45000:180000);
 const timer=controller&&requestTimeout>0?setTimeout(()=>controller.abort(),requestTimeout):null;
 try{
  const r=await fetch('/api/engine/'+engine+'/'+path,{method,headers,body:content,cache:'no-store',credentials:'same-origin',signal:controller?.signal});
  if(!r.ok){const payload=await r.json().catch(()=>({}));throw Error(engine+': '+apiError(payload)+' (HTTP '+r.status+')')}
  return response==='blob'?r.blob():r.json();
 }catch(e){
  if(e?.name==='AbortError')throw Error(engine+': request timed out while waiting for the server');
  throw e;
 }finally{if(timer)clearTimeout(timer)}
}
async function statusCheck(){
 try{
  const r=await fetch('/api/status',{cache:'no-store',credentials:'same-origin'});
  if(!r.ok){const details=await r.json().catch(()=>({}));throw Error('Engine status HTTP '+r.status+': '+apiError(details))}
  const j=await r.json();if(j.source!=='live_health_requests')throw Error('Unverified health response');
  state.status=j.engines||{};

 }catch(e){state.status={};log('Gateway unavailable: '+e.message);notify(e.message)}
 render();

}
async function restoreArtboardSession(){
 // Never automatically reopen a previous workflow or start job polling on page load.
 let saved=null;
 try{saved=JSON.parse(sessionStorage.getItem('mj_artboard_job')||'null')}catch{return}
 if(!saved?.project_id||!saved?.job_id)return;
 try{
  const project=await call('artboard','api/artboard/projects/'+encodeURIComponent(saved.project_id));
  const job=await call('artboard','api/artboard/jobs/'+encodeURIComponent(saved.job_id));
  if(job.project_id!==project.project_id)throw Error('Job/project identity mismatch');
  state.artboardProject=project;state.artboardResult=project;state.artboardJob=job;
  state.pendingArtboardJob=job;
  state.lastMode=saved.mode||project.processing_mode||state.mode.artboard;
  state.lastJobId=job.job_id;
  state.activePipeline=job.stage==='export'?'Export':job.stage==='artboard-prepare'?'Prepare':'Production';
  state.stage=job.step||job.stage||'Previous job';
  state.progress=typeof job.progress==='number'?job.progress:null;
  log('Saved Artboard job verified: '+job.status+' — user choice required');
  render();
 }catch(e){log('Saved Artboard job could not be verified: '+e.message)}
}

function upload(t,opts={}){const f=state.files[t],types=opts.types||'image/png,image/jpeg,image/webp,image/svg+xml,.eps,.pdf,.psd,.ai';const ob=state.objectURLs[t];return `<div class="dropzone" data-droptool="${t}"><span class="upload-icon">⇧</span><strong>${f?'Replace file':'Upload or drag your file'}</strong><small>${esc(opts.help||'Choose an input supported by the selected engine. File is not uploaded until an API action runs.')}</small>${f?`<span class="file-pill">${esc(f.name)} · ${fmtSize(f.size)}</span>`:''}<input aria-label="Upload file for ${esc(t)}" type="file" data-file="${t}" accept="${esc(types)}"></div>${f&&ob?`<div class="mini-note spaced">Local preview from the file you selected; not an AI-generated result.</div>`:''}`}

function updateMonitor(){const logNode=document.querySelector('#terminalText');if(!logNode)return;logNode.textContent=state.logs.length?state.logs.join('\n'):'No API job has been submitted in this session.';logNode.classList.toggle('empty',!state.logs.length);logNode.scrollTop=logNode.scrollHeight;const st=document.querySelector('#stageValue');if(st)st.textContent=state.stage||'Idle';const pct=document.querySelector('#percentValue');if(pct)pct.textContent=pct.classList.contains('orb-value')?(state.progress==null?(state.busy?'Working':'—'):state.progress+'%'):state.progress==null?'':'· '+state.progress+'%';const p=document.querySelector('#progressValue');if(p){p.style.width=(state.progress??0)+'%';p.parentElement.classList.toggle('indeterminate',state.busy&&state.progress==null)}document.querySelectorAll('.live-stepper').forEach(stepper=>{const labels=[...stepper.querySelectorAll('[data-step-index]')],current=pipelineStepIndex(stepper.dataset.liveSteps,labels);labels.forEach((node,i)=>{node.classList.toggle('complete',i<current);node.classList.toggle('current',i===current&&(state.busy||state.progress===100));const small=node.querySelector('small');if(small)small.textContent=i<current?'Completed':i===current&&state.busy?'Processing':i===current&&state.progress===100?'Completed':'Waiting'})});updateArtboardPreview();updateArtboardDetails();const label=document.querySelector('#monitorLabel');if(label){label.textContent=state.busy?'Live request running':state.lastError?'Request failed':'No active processing';label.className='badge '+(state.busy?'warn':state.lastError?'error':'muted')}}

function renderArtboardOutputs(){const p=state.artboardResult;if(!p)return '<p class="muted small">No production files returned yet.</p>';const items=[];for(const part of (p.surfaces||[])){for(const [fmt,path] of Object.entries(part.exports||{})){if(typeof path==='string'&&path)items.push({fmt,part:part.name||part.part_id,path});}}

function artboardStageIndex(){
 const step=(state.stage||'').toLowerCase(),pipeline=(state.activePipeline||'').toLowerCase();
 if(/export|format conversion|manifest/.test(step)||pipeline==='export'&&/complete|ready/.test(step))return 5;
 if(/ai vector review|vector review|re.review|targeted fix|targeted correction/.test(step))return 4;
 if(/semantic|guidance|guided vector/.test(step))return 3;
 if(/validat|saving validated/.test(step)||pipeline==='production'&&/complete|ready/.test(step))return 4;
 if(/vector|optimi|compos/.test(step))return 3;
 if(/generat|ai artwork|reconstruct/.test(step)||pipeline==='production')return 2;
 if(/analy|prepar|locat|surface|geometry/.test(step)||pipeline==='prepare')return 1;
 return 0;
}
function pipelineStepIndex(t,labels){if(t==='artboard')return Math.min(labels.length-1,artboardStageIndex());return state.progress===100?labels.length-1:0}

function artboardVisualStage(){
 const step=(state.stage||'').toLowerCase();
 if(!state.busy)return 'is-idle';
 if(/analy|prepar|scan|surface|upload/.test(step))return 'is-scanning';
 if(/generat|artwork|ai /.test(step))return 'is-generating';
 if(/vector|reconstruct|optimi|compos|validat|export/.test(step))return 'is-vectorizing';
 return 'is-scanning';
}
function artboardPreview(){
 const processed=state.objectURLs.artboard_live;
 const original=state.objectURLs.artboard;
 const url=processed||original;
 const label=processed?'Real engine preview · '+(state.artboardPreviewPath.endsWith('.svg')?'Vector':'AI artwork'):'Uploaded source preview';
 return '<div id="artboardLive" class="artboard-live-preview '+artboardVisualStage()+'">'+
  '<div id="artboardLiveMedia" class="preview-box">'+
  (url?'<img src="'+url+'" alt="'+esc(label)+'">':
   '<div class="preview-empty"><b>No artwork uploaded</b><p>Upload a reference to begin</p></div>')+
  '<div class="scan-beam" aria-hidden="true"></div></div>'+
  '<div class="preview-caption"><b id="artboardLiveStage">'+esc(state.stage||'Ready for artwork')+'</b>'+
  '<small id="artboardLiveType">'+esc(label)+'</small></div></div>';
}
function updateArtboardPreview(){
 const el=document.querySelector('#artboardLive');
 if(!el)return;
 el.className='artboard-live-preview '+artboardVisualStage();
 const stage=document.querySelector('#artboardLiveStage');
 if(stage)stage.textContent=state.stage||'Ready for artwork';
 const type=document.querySelector('#artboardLiveType');
 if(type)type.textContent=state.objectURLs.artboard_live?'Verified server artifact · '+(state.artboardPreviewPath.endsWith('.svg')?'editable vector':'AI-generated artwork'):'Original source · awaiting engine output';
 const img=document.querySelector('#artboardLiveMedia img');
 const url=state.objectURLs.artboard_live||state.objectURLs.artboard;
 if(img&&url&&img.getAttribute('src')!==url)img.src=url;
}
function artboardTelemetry(){
 const p=state.artboardResult||state.artboardProject||{},surfaces=p.surfaces||[],surface=surfaces[0]||p.surface||{};
 const validation=p.validation||{},partValidation=surface.validation||validation.parts?.[0]||{};
 const physical=partValidation.physical_artboard||validation.artboard||{};
 const analysis=p.artwork_analysis?.result||{},reconstruction=p.ai_reconstruction||state.artboardJob?.result?.ai_reconstruction||{};
 const route=Object.values(reconstruction.by_part||{})[0]||reconstruction;
 const provider=route.provider||{};
 const exports=[];
 for(const item of surfaces){for(const [format,path] of Object.entries(item.exports||{})){if(path)exports.push({format,path,part:item.name||item.type||item.part_id})}}
 for(const [format,path] of Object.entries(p.exports||{})){if(path)exports.push({format,path,part:'Project'})}
 const colors=analysis.dominant_colors||[];
 return {p,surfaces,surface,validation,partValidation,physical,analysis,reconstruction,provider,exports,colors};
}
function telemetryValue(value,fallback='Awaiting engine'){return value===undefined||value===null||value===''?fallback:esc(value)}
function liveProductionDetails(){
 const d=artboardTelemetry(),v=d.validation,pv=d.partValidation,physical=d.physical;

 const analyzed=Boolean(Object.keys(d.analysis).length||d.p.surface_analysis),generated=d.reconstruction.complete===true||Boolean(d.provider.model),vectorized=Boolean(pv.trace_backend||pv.path_count||v.path_count),validated=d.p.true_vector_ready===true||v.status==='PASS',exported=d.exports.length>0;
 const current=artboardStageIndex(),mode=d.reconstruction.processing_mode||state.lastMode||state.mode.artboard;
 if(!state.busy&&!analyzed&&!generated&&!vectorized&&!validated&&!exported){
  return `<div class="production-start"><span class="production-start-icon">✦</span><h4>Ready for production</h4><p>One verified request runs analysis, AI artwork reconstruction, vectorization, validation and export.</p>${actionButton('Start Production →','startArtboard','artboard')}</div>`;
 }
 let title='Preparing production',description=state.stage||'Engine request running',facts=[];

  facts=[['True vector',d.p.true_vector_ready===true?'PASS':'Review'],['Canvas',physical.width_in&&physical.height_in?`${physical.width_in} × ${physical.height_in} in`:'22 × 31 in'],['Delivery','Open Export & Delivery below']];
 }else if(current===1){
  title='Analyzing artwork';description='Reading only the selected visible surface and its production composition';
  facts=[['Visible surfaces',analyzed?visible.length:'Scanning'],['Logos',analyzed?logos.length:'Scanning'],['Text regions',analyzed?texts.length:'Scanning'],['Patterns',analyzed?patterns.length:'Scanning'],['Palette',d.colors.length?d.colors.slice(0,4).join(', '):'Detecting'],['Surface',d.surface.name||d.surface.type||'Locating']];
 }else if(current===2){
  title='Creating AI artwork';description='Building full-bleed, flat production artwork from the analyzed design language';

 }else if(current===3){

async function jobPoll(engine,path,terminal,limitMs=600000){
 let started=Date.now(),lastEvent='',consecutivePollErrors=0;
 state.activePipeline=terminal;
 while(Date.now()-started<limitMs){
  let j;
  try{
   j=await call(engine,path,{timeoutMs:30000});consecutivePollErrors=0;
  }catch(e){
   consecutivePollErrors++;
   if(consecutivePollErrors>3)throw e;
   state.stage='Reconnecting to live job status';state.progress=null;
   log(terminal+': status connection interrupted; retry '+consecutivePollErrors+'/3');
   updateMonitor();await new Promise(resolve=>setTimeout(resolve,1600));continue;
  }
  state.lastJobId=j.job_id||'';
  state.stage=j.step||j.stage||j.status||'processing';
  state.progress=typeof j.progress==='number'?Math.max(0,Math.min(100,j.progress)):null;
  if(engine==='artboard'){
   state.artboardJob=j;
   if(state.pendingArtboardJob?.job_id===j.job_id)state.pendingArtboardJob=j;
   for(const event of (j.events||[])){
    const key=[j.job_id,event.at,event.step,event.progress].join('|');
    if(state.artboardEventKeys.has(key))continue;
    state.artboardEventKeys.add(key);state.artboardEvents.push(event);
    if(state.artboardEvents.length>30)state.artboardEvents.shift();
    log('ENGINE: '+(event.step||j.stage)+(typeof event.progress==='number'?' · '+event.progress+'%':''));
   }
  }
  const event=(j.events||[]).at(-1);
  const signature=event?.at||state.stage;
  if(signature!==lastEvent){log(terminal+': '+state.stage+(state.progress!=null?' · '+state.progress+'%':''));lastEvent=signature}
  updateMonitor();
  if(engine==='artboard'&&j.preview_path)await loadArtboardPreview(j.project_id,j.preview_path);
  const status=j.status||j.state;
  if(status==='completed'||status==='ready'||status==='review_required'||status==='awaiting_desktop'){
   state.progress=100;state.stage=j.step||terminal+' complete';updateMonitor();
   if(j.result?.export_errors&&Object.keys(j.result.export_errors).length){
    state.failedFormats=[...new Set(Object.values(j.result.export_errors).map(e=>e.format).filter(Boolean))];
    state.failedStage='export';state.lastExportErrors=j.result.export_errors;
    log('Partial export: '+state.failedFormats.join(', ')+' failed; successful files preserved');
   }else if(terminal==='Export'){state.failedFormats=[];state.failedStage='';state.lastExportErrors=null}
   return j;
  }
  if(status==='failed'||status==='cancelled'){
   state.failedStage=terminal.toLowerCase();
   state.lastExportErrors=j.result?.export_errors||null;
   state.failedFormats=[...new Set(Object.values(state.lastExportErrors||{}).map(e=>e.format).filter(Boolean))];
   const details=Object.values(state.lastExportErrors||{}).map(e=>e.format.toUpperCase()+': '+e.message).join(' | ');
   throw Error(details||j.error?.message||j.error?.technical_summary||terminal+' failed');
  }
  await new Promise(resolve=>setTimeout(resolve,2200));
 }
 throw Error(terminal+' still processing; inspect the job before resubmitting. No automatic paid retry was started.');
}

 if(engine.toLowerCase().includes('artboard')&&obj.project_id){

 }
}

   try{state.artboardResult=await call('artboard','api/artboard/projects/'+state.artboardProject.project_id)}

  function exportedArtifacts(){
    if(!productionApproved())return []; // Never surface stale files from a failed Quality review.
    const p=project(),parts=available().filter(x=>!ui.selected.size||ui.selected.has(x.side)),items=[];
    for(const part of parts)for(const [format,path] of Object.entries(part.exports||{}))

  function artifactEndpoint(projectId,path){
    if(typeof path!=='string'||!path||!projectId)throw Error('Missing verified export path');
    const relative=path.replace(/^projects\/[^/]+\//,'');
    if(!relative||relative.startsWith('/')||relative.split('/').some(segment=>segment==='..'||segment==='.'||!segment))
      throw Error('Invalid export path in engine manifest');
    return 'api/artboard/projects/'+encodeURIComponent(projectId)+'/artifacts/'+relative.split('/').map(encodeURIComponent).join('/');
  }
  function crc32(bytes){
    let crc=0xffffffff;
    for(const byte of bytes){crc^=byte;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}
    return (crc^0xffffffff)>>>0;
  }
  function assembleMasterZip(entries){
    if(!entries.length)throw Error('No exported files are available to package');
    if(entries.length>65535)throw Error('Too many files for a standard ZIP');
    const encoder=new TextEncoder(),local=[],central=[];
    let offset=0,centralSize=0;
    for(const entry of entries){
      const filename=encoder.encode(entry.name),data=entry.data;
      if(!filename.length||filename.length>65535||data.length>=0xffffffff)throw Error('ZIP entry exceeds standard size limits');
      const sum=crc32(data);
      const header=new Uint8Array(30+filename.length),h=new DataView(header.buffer);
      h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x800,true);
      h.setUint16(8,0,true);h.setUint32(14,sum,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);
      h.setUint16(26,filename.length,true);header.set(filename,30);local.push(header,data);
      const record=new Uint8Array(46+filename.length),c=new DataView(record.buffer);
      c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x800,true);
      c.setUint16(10,0,true);c.setUint32(16,sum,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);
      c.setUint16(28,filename.length,true);c.setUint32(42,offset,true);record.set(filename,46);central.push(record);
      centralSize+=record.length;offset+=header.length+data.length;
      if(offset>=0xffffffff||centralSize>=0xffffffff)throw Error('Master ZIP exceeds the standard 4 GB ZIP limit');
    }
    const end=new Uint8Array(22),e=new DataView(end.buffer);
    e.setUint32(0,0x06054b50,true);e.setUint16(8,entries.length,true);e.setUint16(10,entries.length,true);
    e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);

  async function downloadMasterZip(){
    if(ui.zipBusy)return;
    if(!productionApproved())return notify('AI vector review and technical validation must pass before packaging');
    const p=project(),items=exportedArtifacts(),serverZip=items.find(item=>item.format==='zip');
    if(!p.project_id)return notify('No completed project is available');
    // Download an actual engine-supplied ZIP untouched when the API returns one.
    if(serverZip&&ui.selected.size===available().length)return download('artboard',artifactEndpoint(p.project_id,serverZip.path));
    const files=items.filter(item=>item.format!=='zip');
    if(!files.length)return notify('No exported files are available for a master ZIP');
    const button=document.querySelector('[data-abv2="download-master-zip"]');
    const label=document.querySelector('[data-abv2-zip-status]');
    ui.zipBusy=true;if(button)button.disabled=true;
    const update=message=>{if(label)label.textContent=message;};
    try{
      const seen=new Set(),entries=[];
      for(let i=0;i<files.length;i++){
        const item=files[i];update('Packaging existing files: '+(i+1)+' / '+files.length);
        const blob=await call('artboard',artifactEndpoint(p.project_id,item.path),{response:'blob'});
        if(!blob?.size)throw Error('Engine returned an empty '+item.format.toUpperCase()+' file');
        const data=new Uint8Array(await blob.arrayBuffer());
        const raw=(item.path.split('/').pop()||'artifact.'+item.format).replace(/[^a-zA-Z0-9_. -]/g,'_');
        const folder=item.label==='Project'?'Project':item.label;
        let name=folder+'/'+raw,index=1;
        while(seen.has(name))name=folder+'/'+index+++'_'+raw;
        seen.add(name);entries.push({name,data});
      }
      update('Building ZIP from '+entries.length+' exported files…');
      const zip=assembleMasterZip(entries);
      const href=URL.createObjectURL(zip),a=document.createElement('a');
      a.href=href;a.download='Artboard_'+String(p.project_id).replace(/[^a-zA-Z0-9_-]/g,'').slice(0,48)+'_Master_'+(p.processing_mode==='quality'?'quality':'normal')+'.zip';
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(href),60000);
      update('ZIP downloaded: '+entries.length+' existing files. No new production was started.');
      log('Downloaded client-assembled ZIP from '+entries.length+' actual Artboard artifacts');
    }catch(error){update('ZIP download failed: '+error.message);notify('ZIP download failed: '+error.message);}
    finally{ui.zipBusy=false;if(button)button.disabled=false;}
  }

    const j=savedJob();if(!j?.job_id)return;
    try{
      const latest=await call('artboard','api/artboard/jobs/'+encodeURIComponent(j.job_id));
      state.artboardJob=latest;state.pendingArtboardJob=latest;
      state.stage=latest.step||latest.status;state.progress=typeof latest.progress==='number'?latest.progress:null;
      if(latest.status==='cancelled'&&ui.cancelRequested){reset(true);return}
      render();
    }catch(e){notify('Job status unavailable: '+e.message)}
  }
  async function stop(){
    if(cancellationPollInFlight)return;
    const job=savedJob();
    if(!job?.job_id){
      if(state.busy){ui.cancelRequested=true;state.stage='Stopping current upload before next job';render();notify('Stop requested; new AI jobs will not start');return}
      reset();return;
    }
    if(['cancelled','completed','failed'].includes(job.status)){reset(true);return}
    ui.cancelRequested=true;ui.stageStatus='cancelling';state.stage='Cancelling job…';render();
    cancellationPollInFlight=true;
    try{
      const id=encodeURIComponent(job.job_id);
      const response=await call('artboard','api/artboard/jobs/'+id+'/cancel',{method:'POST'});
      if(!response.cancellation_requested&&!['cancelled','completed','failed'].includes(response.status))notify('Worker unavailable; checking its stored state');
      for(let attempt=0;attempt<45;attempt++){
        const latest=await call('artboard','api/artboard/jobs/'+id);
        state.artboardJob=latest;state.pendingArtboardJob=latest;
        if(['cancelled','completed','failed'].includes(latest.status)){
          reset(true);notify('Previous job closed. New input is ready.');return;
        }
        state.stage='Cancelling — waiting for engine safe boundary';
        if(attempt%4===0)render();
        await sleep(2000);
      }
      ui.phase='input';ui.view=null;render();
      notify('Still cancelling on server. Use Check Status; no new paid job started.');
    }catch(e){ui.phase='input';ui.view=null;render();notify('Could not confirm cancellation: '+e.message)}
    finally{cancellationPollInFlight=false}
  }
  function reset(force=false){
    if(state.busy&&!force)return notify('Cancel the active job before starting a new input');
    ++ui.workspaceEpoch;ui.preferInput=false;ui.phase='input';ui.view=null;ui.analysisDone=false;ui.generationStarted=false;ui.processingStage='';ui.downloadFormat='';ui.prepared=[];
    ui.selected.clear();ui.visitedStages.clear();ui.stageStatus='';ui.lastPreviewPath='';ui.continued=false;
    ui.productionDone=false;ui.finishing=false;ui.exportStarted=false;ui.cancelRequested=false;ui.handoffBusy=false;
    ui.generationError='';ui.compareSource=false;ui.validationSide=null;ui.assetBusy.clear();ui.assetRetry={};
    for(const url of Object.values({...ui.generatedUrls,...ui.vectorUrls}))URL.revokeObjectURL(url);
    ui.generatedUrls={};ui.vectorUrls={};state.artboardPreviewPath='';state.files.artboard=null;
    state.artboardProject=null;state.artboardResult=null;state.artboardJob=null;state.pendingArtboardJob=null;
    for(const key of ['artboard','artboard_live']){if(state.objectURLs[key])URL.revokeObjectURL(state.objectURLs[key]);delete state.objectURLs[key]}
    state.activePipeline='';state.busy=false;state.stage='';state.progress=null;state.lastError='';state.logs=[];
    state.artboardEvents=[];state.artboardEventKeys.clear();
    try{sessionStorage.removeItem('mj_artboard_job')}catch{}
    render();
  }
  // Protect all ecosystem buttons: intercept only Artboard V2-specific actions in capture phase.
  document.addEventListener('click',async e=>{
    const b=e.target.closest('button[data-abv2]');if(!b)return;
    e.preventDefault();e.stopPropagation();const a=b.dataset.abv2;
    if(a==='resume-vector')return resumeVectorStages();if(a==='start')return start();if(a==='resume-job')return resumeSavedJob();if(a==='refresh-job')return refreshSavedJob();if(a==='continue-vectorization')return continueToVectorization();if(a==='produce')return produce();if(a==='stop')return stop();
    if(a==='clear'){if(state.busy)return;state.files.artboard=null;const u=state.objectURLs.artboard;if(u)URL.revokeObjectURL(u);delete state.objectURLs.artboard;render();return}
    if(a==='home'||a==='new')return reset();
    if(a==='toggle-compare'){
      const selected=available().find(part=>part.side===ui.validationSide)||available().find(part=>ui.selected.has(part.side))||available()[0];
      if(!selected||!ui.generatedUrls[selected.side]||!ui.vectorUrls[selected.side])return notify('AI artwork and saved SVG previews are both required for comparison');
      ui.compareSource=!ui.compareSource;render();return;
    }
    if(a.startsWith('review-side:')){
      const side=a.slice('review-side:'.length);
      if(!available().some(part=>part.side===side)||ui.selected.size&&!ui.selected.has(side))return;
      ui.validationSide=side;ui.compareSource=false;render();return;
    }
    if(a==='illustrator-handoff')return downloadIllustratorHandoff(false);
    if(a==='illustrator-handoff-reference')return downloadIllustratorHandoff(true);
    if(a==='illustrator')return continueSelectedIllustrator();if(a==='download-master-zip')return downloadMasterZip();if(a.startsWith('select-format:')){ui.downloadFormat=a.split(':')[1];render();return;}
    if(a==='previous'){if(state.busy)return notify('Active job: cancel processing before changing stages');
      if(ui.view==='processing'&&ui.processingStage==='Validation'){ui.processingStage='Vectorization';ui.compareSource=false;}
      else if(ui.phase==='export'){ui.view='processing';ui.processingStage='Validation';}
      else if(ui.phase==='artwork'||ui.phase==='analyze')ui.view='input';
      else {ui.view='artwork';ui.compareSource=false;}render();return}
    if(a.startsWith('mode:')){if(state.busy)return;state.mode.artboard=a.split(':')[1];render();return}
    if(a.startsWith('recreate:'))return notify('AI missing-side recreation is not exposed through this frontend’s existing Artboard gateway allowlist. No request was submitted.');
  },true);
  document.addEventListener('change',e=>{const visible=e.target.closest('[data-abv2-visible]');if(visible){const side=visible.dataset.abv2Visible;if(visible.checked)ui.visibleChoice.add(side);else ui.visibleChoice.delete(side);render();return;}const b=e.target.closest('[data-abv2-select]');if(!b)return;const side=b.dataset.abv2Select;if(b.checked)ui.selected.add(side);else ui.selected.delete(side);render();},true);
  document.addEventListener('change',e=>{if(e.target?.dataset?.file!=='artboard')return;ui.dimensions='';const f=e.target.files?.[0];if(!f||!f.type.startsWith('image/')||f.type.includes('svg'))return;const image=new Image();const url=URL.createObjectURL(f);image.onload=()=>{ui.dimensions=`${image.naturalWidth} × ${image.naturalHeight} px`;URL.revokeObjectURL(url);if(state.files.artboard===f)render()};image.onerror=()=>URL.revokeObjectURL(url);image.src=url;});
  // Preserve the ecosystem menu behavior, but collapse the sidebar when Artboard opens.
  document.addEventListener('click',e=>{const t=e.target.closest('[data-tool]');if(t?.dataset.tool==='artboard'){ui.view=null;ui.phase='input';ui.preferInput=Boolean(savedJob()?.job_id);document.body.classList.add('sidebar-collapsed');if(typeof closeMenu==='function')closeMenu()}},true);
  // Keep the existing start action available for code paths that call it directly.
  startArtboard=start;
  if(state.tool==='artboard'){document.body.classList.add('artboard-workspace');document.body.classList.add('sidebar-collapsed');render();}
})();
</script>
