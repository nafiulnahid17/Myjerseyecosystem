name: My Jersey frontend and gateway checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: production-studio/package-lock.json
      - name: Build Production Studio
        run: |
          npm --prefix production-studio ci
          npm --prefix production-studio run build
          node scripts/build-cloudflare.mjs --check
      - name: Verify Python gateway and frontend contracts
        run: |
          python -m pip install -r requirements.txt pytest
          python -m pytest -q tests
          python -m compileall -q gateway.py
      - name: Verify JavaScript and Worker routing
        run: |
          node --check app.js
          node --check home-theme.js
          node --check src/cloudflare.mjs
          node --test tests/test_worker.mjs
          node tests/test_navigation_toggle.cjs
      - name: Verify standalone offline preview
        run: |
          node scripts/build-standalone.mjs
          git diff --exit-code -- Standalone_Interactive_Preview.html
