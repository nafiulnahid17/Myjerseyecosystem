name: My Jersey frontend and gateway checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify backend and frontend contracts
        run: python -m pytest -q tests
      - name: Verify JavaScript syntax
        run: node --check app.js
      - name: Build standalone offline preview
        run: |
          node scripts/build-standalone.mjs
          python -c "from pathlib import Path; s=Path('Standalone_Interactive_Preview.html').read_text(); assert 'data:image/webp;base64,' in s and len(s)>100000"
      - name: Compile gateway
        run: python -m compileall -q gateway.py
